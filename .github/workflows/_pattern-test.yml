name: Pattern Test

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  selfcontained:
    runs-on: ubuntu-latest
    steps:
      - name: Manual checkout (no actions/checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          echo "Cloned $(git rev-parse --short HEAD) on ${GITHUB_REF_NAME}"
          ls -la | head

      - name: System Python + run tests (no actions/setup-python)
        run: |
          cd repo
          python3 --version
          python3 -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install -e . -q
          pip install pytest -q
          HYPERAI_ALLOW_STUBS=1 python3 -m pytest tests/ -q

      - name: GitHub REST API via curl (no actions/github-script)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('repo:', d['full_name'], '| open_issues:', d['open_issues_count'])"
