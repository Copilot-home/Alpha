# Auto-labeling configuration for pull requests
# Based on changed files (actions/labeler v5 format)

# Core framework changes
'core':
  - changed-files:
      - any-glob-to-any-file: 'digital_ai_organism_framework.py'

# Documentation
'documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'
          - 'README.md'
          - 'CONTRIBUTING.md'

# Tests
'tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**/*'
          - '**/test_*.py'
          - '**/*_test.py'

# Examples & Demos
'examples':
  - changed-files:
      - any-glob-to-any-file:
          - 'demo.py'
          - 'examples/**/*'

# GitHub specific
'github':
  - changed-files:
      - any-glob-to-any-file: '.github/**/*'

# CI/CD
'ci-cd':
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**/*'

# Dependencies
'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements.txt'
          - 'setup.py'
          - 'pyproject.toml'

# Blog & Distribution
'content':
  - changed-files:
      - any-glob-to-any-file:
          - 'blog/**/*'
          - 'distribution/**/*'
          - 'video/**/*'

# Research
'research':
  - changed-files:
      - any-glob-to-any-file: 'research/**/*'

# Community
'community':
  - changed-files:
      - any-glob-to-any-file:
          - 'community/**/*'
          - 'CODE_OF_CONDUCT.md'
          - '.github/SUPPORT.md'

# Planning
'planning':
  - changed-files:
      - any-glob-to-any-file: 'planning/**/*'
