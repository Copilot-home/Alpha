name: DAIOF CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  HYPERAI_ALLOW_STUBS: "1"
  CORE_PATHS: "digital_ai_organism_framework.py haios_core.py src tests"

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov black flake8 isort mypy

    - name: 🎨 Check code style with Black
      run: black --check ${{ env.CORE_PATHS }}

    - name: 🔍 Lint with flake8 (blocking)
      run: flake8 ${{ env.CORE_PATHS }} --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 🔍 Lint with flake8 (informational)
      run: flake8 . --count --exit-zero --statistics
      continue-on-error: true

    - name: 🧬 Verify immutable genes
      run: |
        python -c "
        from digital_ai_organism_framework import DigitalGenome
        genome = DigitalGenome()
        assert 'human_dependency_coefficient' in genome.traits
        assert genome.traits['human_dependency_coefficient'] == 1.0
        print('Immutable genes verified')
        "

    - name: 🧪 Run tests
      run: pytest tests/ --cov=digital_ai_organism_framework --cov-report=xml --cov-report=term

    - name: 📊 Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  validate:
    name: Validate Framework
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: 🎼 Test Symphony Control Center
      run: |
        python -c "
        from digital_ai_organism_framework import SymphonyControlCenter
        SymphonyControlCenter()
        print('Symphony Control Center functional')
        "

    - name: 🧬 Test Digital Organism lifecycle
      run: |
        python -c "
        from digital_ai_organism_framework import DigitalOrganism
        organism = DigitalOrganism(name='ci_organism')
        organism.live_cycle(time_delta=1.0)
        assert organism.health > 0
        print(f'Organism lifecycle working (health: {organism.health:.2f})')
        "

    - name: 🌍 Test Ecosystem
      run: |
        python -c "
        from digital_ai_organism_framework import DigitalEcosystem, DigitalOrganism
        ecosystem = DigitalEcosystem('ci_ecosystem')
        for i in range(5):
            ecosystem.add_organism(DigitalOrganism(name=f'org_{i}'))
        ecosystem.simulate_time_step(1.0)
        assert len(ecosystem.organisms) == 5
        print(f'Ecosystem functional with {len(ecosystem.organisms)} organisms')
        "

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 🔒 Run safety check
      run: |
        pip install safety
        safety check --json || true
      continue-on-error: true

    - name: 🔐 Run bandit security linter
      run: |
        pip install bandit
        bandit -r digital_ai_organism_framework.py haios_core.py src -f json || true
      continue-on-error: true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🎉 Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: DAIOF ${{ github.ref_name }}
        body: |
          ## Digital AI Organism Framework Release

          See [CHANGELOG.md](CHANGELOG.md) for details.

          **Status**: Production Ready

          Creator: Alpha_Prime_Omega (4287)
          Maintainer: Digital AI Organism
        draft: false
        prerelease: false
