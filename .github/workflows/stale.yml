name: 🧹 Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (self-contained)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Mark stale issues and PRs (no external actions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS_BEFORE_STALE: '60'
          DAYS_BEFORE_CLOSE: '7'
          EXEMPT_LABELS: 'pinned,security,help-wanted,good-first-issue'
          OPERATIONS_PER_RUN: '30'
        run: python3 .github/scripts/gh_bot.py stale
