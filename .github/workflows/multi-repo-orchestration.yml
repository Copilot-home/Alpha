name: Multi Repo Orchestration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Orchestration operation to run'
        required: false
        default: 'full_orchestration'
      emergency_mode:
        description: 'Run in emergency mode'
        required: false
        default: 'false'

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: 🧬 Initialize Orchestration Environment
        run: |
          echo "🧬 DAIOF MULTI-REPOSITORY ORCHESTRATION SYSTEM"
          echo "🎼 Framework: HYPERAI | Creator: Nguyễn Đức Cường (alpha_prime_omega)"
          echo "✈ Auxiliary Pilots: ACTIVATING"
          echo "📊 Operation Mode: ${{ github.event.inputs.operation || 'full_orchestration' }}"
          echo "🚨 Emergency Mode: ${{ github.event.inputs.emergency_mode || 'false' }}"

      - name: 📥 Checkout (self-contained)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: 📦 Install Orchestration Dependencies
        run: |
          pip install --upgrade pip
          pip install PyGithub pyyaml python-dotenv requests
